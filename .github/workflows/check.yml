name: 앱 검사

on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'runtime-src/**'
      - 'tests/**'
      - 'work/curriculum/**'
      - 'package*.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'index.html'
      - '.github/workflows/check.yml'

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The setup PR precedes the first PR containing the app.
      - uses: actions/setup-node@v4
        if: ${{ hashFiles('package.json') != '' }}
        with:
          node-version: 22
          cache: npm
      - if: ${{ hashFiles('package.json') != '' }}
        run: npm ci && npm test && npm run build
