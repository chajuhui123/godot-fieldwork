name: 수업 내용 오류
description: 설명, 퀴즈, 예시 코드, 출처가 틀렸거나 이해하기 어려운 부분을 알려 주세요.
title: "[수업] "
labels: ["content"]
body:
  - type: input
    id: lesson
    attributes:
      label: 수업 주소
      description: 브라우저 주소창의 주소를 붙여 주세요.
      placeholder: https://chajuhui123.github.io/godot-fieldwork/#editor
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 문제가 있는 부분
      description: 해당 문장이나 퀴즈, 코드를 그대로 옮겨 주세요.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 바르게 고친 내용
      description: 알고 있다면 올바른 설명이나 근거가 되는 공식 문서 링크를 적어 주세요.
